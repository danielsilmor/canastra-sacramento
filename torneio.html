<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torneio de bots · Canastra Sacramento</title>
  <style>
    :root { --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e; --text: #f5f5f7; --muted: #8e8e93; --green: #30d158; --red: #ff453a; --yellow: #ffd60a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, "Segoe UI", Arial, sans-serif; padding: 24px 16px; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    .panel { background: var(--surface); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    select, input { font: inherit; color: var(--text); background: var(--surface-2); border: 0; border-radius: 10px; height: 38px; padding: 0 10px; min-width: 140px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; height: 40px; padding: 0 18px; cursor: pointer; background: var(--text); color: #000; }
    button:disabled { opacity: 0.4; cursor: default; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 14px; }
    .bar > div { height: 100%; width: 0; background: var(--green); transition: width 0.2s; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid #2c2c2e; }
    th:first-child, td:first-child { text-align: left; color: var(--muted); }
    .verdict { font-size: 17px; font-weight: 600; margin: 4px 0 12px; }
    .verdict.win { color: var(--green); } .verdict.tie { color: var(--yellow); }
    .note { color: var(--muted); font-size: 13px; }
    pre#result { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Torneio de bots</h1>
  <p class="sub">Compara duas inteligências jogando as mesmas cartas: cada distribuição é jogada duas vezes,
    com as duplas trocando de lugar, para a sorte se anular.</p>

  <div class="panel">
    <div class="row">
      <label>Bot A <select id="a"></select></label>
      <label>Bot B <select id="b"></select></label>
      <label>Distribuições <input id="n" type="number" min="5" max="5000" value="50"></label>
      <label>Orçamento das simulações
        <select id="scale"><option value="1">100% (como no jogo)</option><option value="0.5">50% (mais rápido)</option><option value="0.25">25% (bem mais rápido)</option></select>
      </label>
      <label>Semente <input id="seed" type="number" value="1"></label>
      <button id="run">Rodar torneio</button>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <p class="note" id="status">Bots que simulam (Esperto e Mestre) levam alguns segundos por rodada.</p>
  </div>

  <div class="panel" id="out" hidden></div>
  <pre id="result"></pre>
</main>

<script src="js/cards.js"></script>
<script src="js/rules.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/mestre.js"></script>
<script src="js/arena.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  for (const [k, v] of Object.entries(Arena.BOTS)) {
    $('a').insertAdjacentHTML('beforeend', `<option value="${k}">${v.label}</option>`);
    $('b').insertAdjacentHTML('beforeend', `<option value="${k}">${v.label}</option>`);
  }
  $('a').value = 'mestre';
  $('b').value = 'esperto';

  function show(sum) {
    const keys = Object.keys(sum[sum.a]);
    const names = {
      pontosPorRodada: 'Pontos por rodada', rodadasVencidas: 'Rodadas vencidas', bates: 'Rodadas em que bateu',
      cartasNaMaoNoFim: 'Cartas na mão no fim da rodada', canastrasLimpas: 'Canastras limpas por rodada',
      lixoEntreguePor100Rodadas: 'Lixo entregue (a cada 100 rodadas)', presoPor100Rodadas: 'Ficou preso com 1 carta (a cada 100)',
      msPorJogada: 'Tempo por jogada (ms)',
    };
    const cls = sum.veredito.startsWith('Empate') ? 'tie' : 'win';
    $('out').hidden = false;
    $('out').innerHTML =
      `<div class="verdict ${cls}">${sum.veredito}</div>` +
      `<p>Diferença: <b>${sum.diferencaPorRodada >= 0 ? '+' : ''}${sum.diferencaPorRodada}</b> pontos por rodada para ${sum.a}, ` +
      `margem de erro ±${sum.margemDeErro95} (95%), em ${sum.rodadas} rodadas (${sum.distribuicoes} distribuições).</p>` +
      `<table><tr><th></th><th>${sum.a}</th><th>${sum.b}</th></tr>` +
      keys.map((k) => `<tr><td>${names[k] || k}</td><td>${sum[sum.a][k]}</td><td>${sum[sum.b][k]}</td></tr>`).join('') +
      '</table>';
  }

  // Interface: roda em pedaços para a página não congelar.
  $('run').onclick = async () => {
    const a = $('a').value; const b = $('b').value;
    const n = Math.max(1, +$('n').value); const scale = +$('scale').value; const seed0 = +$('seed').value;
    $('run').disabled = true;
    const parts = [];
    for (let i = 0; i < n; i++) {
      parts.push(Arena.duplicate(a, b, 1, seed0 + i, scale));
      $('progress').style.width = `${(100 * (i + 1)) / n}%`;
      $('status').textContent = `Distribuição ${i + 1} de ${n}…`;
      await new Promise((r) => setTimeout(r, 0));
    }
    show(Arena.summarize(Arena.merge(parts)));
    $('status').textContent = 'Pronto.';
    $('run').disabled = false;
  };

  // Modo automático (para rodar vários torneios em paralelo):
  // torneio.html?auto=1&a=mestre&b=esperto&n=20&seed=1&scale=0.5  → resultado em JSON.
  const q = new URLSearchParams(location.search);
  if (q.get('auto')) {
    try {
      const res = Arena.duplicate(q.get('a'), q.get('b'), +q.get('n') || 10, +q.get('seed') || 1, +q.get('scale') || 1);
      $('result').textContent = JSON.stringify(res);
    } catch (e) {
      $('result').textContent = JSON.stringify({ error: e.stack });
    }
    document.title = 'DONE';
  }
</script>
</body>
</html>
